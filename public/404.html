<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Redirecting...</title>
    <script>
      (function () {
        var repo = "/portfolio";
        var path = window.location.pathname;

        var rest = path.startsWith(repo)
          ? path.slice(repo.length)
          : path;

        if (!rest.startsWith("/")) {
          rest = "/" + rest;
        }

        var target =
          repo +
          "/?p=" +
          encodeURIComponent(rest + window.location.search + window.location.hash);

        window.location.replace(target);
      })();
    </script>
  </head>
  <body></body>
</html>
